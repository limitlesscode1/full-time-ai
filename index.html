function analysisEvidenceHtml(comp,home,away){
 const L=LV.lg[comp];if(!L||!Array.isArray(L.fx))return'';

 const recent=t=>done.filter(f=>f.home===t||f.away===t).slice(0,5);
 const venue=(t,side)=>done.filter(f=>side==='home'?f.home===t:f.away===t).slice(0,5);
 const stat=(arr,t)=>{let w=0,d=0,l=0,gf=0,ga=0;const form=[];arr.forEach(f=>{const h=f.home===t,m=h?f.hs:f.as,o=h?f.as:f.hs;gf+=m;ga+=o;if(m>o)w++;else if(m===o)d++;else l++;form.push(m>o?'W':m===o?'D':'L')});return{n:arr.length,w,d,l,gf,ga,form:form.join('')}};
 const hs=stat(recent(home),home),as=stat(recent(away),away),hvs=stat(venue(home,'home'),home),avs=stat(venue(away,'away'),away);
 const standing=t=>{const r=(L.table||[]).find(x=>x.t===t);if(!r)return'Unavailable';const vals=[r.P,r.pts,r.w,r.d,r.l,r.gf,r.ga];if(vals.some(v=>v!==null&&v!==undefined&&(!Number.isFinite(Number(v))||Number(v)<0)))return'Unavailable';const i=L.table.indexOf(r);return`#${r.rank||i+1} · ${r.pts} pts · ${r.P} played`};
 const meetings=done.filter(f=>(f.home===home&&f.away===away)||(f.home===away&&f.away===home)).slice(0,5);
 const avg=(n,g)=>n?(g/n).toFixed(2):'—';
 const row=(t,x)=>`<tr><td>${adH(t)}</td><td>${x.n}/5</td><td>${x.form||'—'}</td><td>${avg(x.n,x.gf)}</td><td>${avg(x.n,x.ga)}</td><td>${standing(t)}</td></tr>`;
 const age=L.fxAsOf?Math.max(0,Math.floor((Date.now()-L.fxAsOf)/36e5)):null;
 const fresh=age===null?'Match-data update time unavailable':age<1?'Match data updated within the last hour':`Match data last updated ${age} hours ago`;
 const split=(t,label,x)=>`${adH(t)} ${label}: ${x.n}/5 available matches · ${avg(x.n,x.gf)} scored / ${avg(x.n,x.ga)} conceded per match.`;
 return `<div class='card' style='margin-top:12px'><h3 class='sm' style='margin:0 0 5px'>Verified competition evidence</h3><p class='sm'>Unique completed matches and standings from ${adH(comp)} only. A match must have a full-time status, valid non-negative integer scores and a valid kickoff date. Repeated fixture IDs and duplicate team/date/score records are counted once. This factual context is separate from the app’s outcome calculations.</p><div class='tw'><table><thead><tr><th>Team</th><th>Sample</th><th>Last results</th><th>GF / game</th><th>GA / game</th><th>Standing</th></tr></thead><tbody>${row(home,hs)}${row(away,as)}</tbody></table></div><p class='sm' style='margin:8px 0 4px'><b>Home / away split (up to five matches)</b></p><p class='sm'>${split(home,'at home',hvs)} ${split(away,'away',avs)}</p><p class='sm' style='margin:8px 0 4px'><b>Head-to-head in this competition</b></p><p class='sm'>${meetings.length?meetings.map(f=>`${adH(f.home)} ${f.hs}–${f.as} ${adH(f.away)} · ${fmt(f.ko)}`).join('<br>'):'No completed head-to-head meeting found in the currently cached competition fixtures.'}</p><p class='sm'>${fresh}. All samples show their actual available count; missing matches are not estimated or filled in.</p></div>`;
}

async function crRun(){if(CRrun)return;CRrun=1;try{while(CRQ.length){if(Date.now()<CRhold)await crSleep(CRhold-Date.now());const n=CRQ.shift();if(crUrl(n)||crMissRecent(n))continue;

const adSt=(e,u)=>{if(u&&u.cloud){if(u.status==='banned')return'banned';if(u.status==='locked'&&(!u.lockedUntil||u.lockedUntil>Date.now()))return'locked';return'active'}return LOCK.get(e)?'locked':'active'};

async function adSetStatus(e,st,until,reason){
  const u=USERS[e];

  if(!u||!u.uid)
    return{ok:0,m:'This account cannot be changed.'};

  if(u.role==='admin')
    return{ok:0,m:'Admin accounts cannot be locked or banned.'};

  const t=await cTok();

  if(!t)
    return{ok:0,m:'Your session has expired. Please sign in again.'};

  const action={
    banned:'ban',
    locked:'lock',
    active:u.status==='banned'?'unban':'unlock'
  }[st];

  const body={
    user_id:u.uid,
    action,
    reason:reason||''
  };

  if(action==='lock'&&until){
    body.locked_until=new Date(until).toISOString();
  }

  const r=await cReq('/functions/v1/admin-user-status',{
    method:'POST',
    token:t,
    body
  });

  if(!r.ok){
    return{
      ok:0,
      m:(r.json&&r.json.error)||'Could not update account status. Please try again.'
    };
  }

  if(!r.json||!r.json.ok||!r.json.user){
    return{ok:0,m:'The server returned an unexpected response.'};
  }

  u.status=r.json.user.status;
  u.lockedUntil=r.json.user.locked_until
    ?Date.parse(r.json.user.locked_until):0;
  u.sreason=r.json.user.status_reason||'';

  return{ok:1};
}

<script>
/* Styled dropdowns: each <select> keeps working (value, onchange) but is shown as a themed menu. */
(function(){
 var doc=document,cur=null,menu=null,items=[],act=-1,typed='',typedT=0;
 var esc=function(t){var d=doc.createElement('div');d.textContent=t;return d.innerHTML};
 var lab=function(s){var o=s.options[s.selectedIndex];return o?o.textContent.replace(/\s+/g,' ').trim():''};
 function paint(s){var b=s._ssb;if(!b)return;var t=lab(s);b.querySelector('.ssv').textContent=t||'Select';b.disabled=s.disabled;b.classList.toggle('ph',!s.value)}
 function close(){if(menu){menu.remove();menu=null}if(cur){cur.setAttribute('aria-expanded','false');cur=null}items=[];act=-1}
 function mark(i,scroll){if(!menu)return;var n=menu.querySelectorAll('.sso');n.forEach(function(x){x.classList.remove('act')});act=i;if(n[i]){n[i].classList.add('act');if(scroll)n[i].scrollIntoView({block:'nearest'})}}
 function pick(s,i){var o=items[i];if(!o||o.disabled)return;var ch=s.selectedIndex!==o.index;s.selectedIndex=o.index;paint(s);var b=s._ssb;close();if(b)b.focus();if(ch){s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}))}}
 function place(b){var r=b.getBoundingClientRect(),vw=doc.documentElement.clientWidth,vh=window.innerHeight;
  menu.style.minWidth=Math.min(r.width,vw-16)+'px';menu.style.maxWidth=(vw-16)+'px';menu.style.width='auto';
  var left=Math.max(8,Math.min(r.left,vw-menu.offsetWidth-8));
  var below=vh-r.bottom-12,above=r.top-12,h=menu.scrollHeight+12,up=below<Math.min(h,240)&&above>below,avail=Math.max(120,up?above:below);
  menu.style.maxHeight=Math.min(avail,360)+'px';
  menu.style.left=left+'px';
  if(up){menu.style.top='auto';menu.style.bottom=(vh-r.top+6)+'px'}else{menu.style.bottom='auto';menu.style.top=(r.bottom+6)+'px'}}
 function open(s){close();var b=s._ssb;if(!b||b.disabled)return;
  menu=doc.createElement('div');menu.className='ssm';menu.setAttribute('role','listbox');var h='';items=[];
  function add(o){var i=items.length;items.push(o);h+='<div class="sso'+(o.selected?' on':'')+(o.disabled?' off':'')+'" role="option" data-i="'+i+'" aria-selected="'+o.selected+'">'+esc(o.textContent.replace(/\s+/g,' ').trim())+'</div>'}
  Array.prototype.forEach.call(s.children,function(c){if(c.tagName==='OPTGROUP'){h+='<div class="ssg">'+esc(c.label||'')+'</div>';Array.prototype.forEach.call(c.children,add)}else if(c.tagName==='OPTION')add(c)});
  menu.innerHTML=h;doc.body.appendChild(menu);cur=b;b.setAttribute('aria-expanded','true');
  menu.addEventListener('mousedown',function(e){e.preventDefault()});
  menu.addEventListener('click',function(e){var x=e.target.closest('.sso');if(x)pick(s,+x.dataset.i)});
  menu.addEventListener('mousemove',function(e){var x=e.target.closest('.sso');if(x&&+x.dataset.i!==act)mark(+x.dataset.i,false)});
  place(b);var sel=items.findIndex(function(o){return o.selected});mark(sel<0?0:sel,true)}
 function step(d){var n=items.length,i=act;for(var k=0;k<n;k++){i=(i+d+n)%n;if(!items[i].disabled)break}mark(i,true)}
 function enhance(s){
  if(s._ssb||s.multiple||s.size>1||s.hasAttribute('data-native'))return;
  var b=doc.createElement('button');b.type='button';b.className='ssb';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
  b.innerHTML='<span class="ssv"></span><svg class="ssc" viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  var lb=s.closest('label');if(lb){var t=Array.prototype.filter.call(lb.childNodes,function(n){return n.nodeType===3}).map(function(n){return n.textContent}).join(' ').trim();if(t)b.setAttribute('aria-label',t)}
  s.classList.add('ss-n');s.tabIndex=-1;s.setAttribute('aria-hidden','true');
  s.parentNode.insertBefore(b,s.nextSibling);s._ssb=b;b._ss=s;
  b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(cur===b)close();else open(s)});
  b.addEventListener('keydown',function(e){var k=e.key;
   if(!menu){if(k==='ArrowDown'||k==='ArrowUp'||k==='Enter'||k===' '){e.preventDefault();open(s)}return}
   if(k==='ArrowDown'){e.preventDefault();step(1)}else if(k==='ArrowUp'){e.preventDefault();step(-1)}
   else if(k==='Home'){e.preventDefault();mark(0,true)}else if(k==='End'){e.preventDefault();mark(items.length-1,true)}
   else if(k==='Enter'||k===' '){e.preventDefault();pick(s,act)}
   else if(k==='Escape'){e.preventDefault();e.stopPropagation();close()}
   else if(k==='Tab'){close()}
   else if(k.length===1){typed+=k.toLowerCase();clearTimeout(typedT);typedT=setTimeout(function(){typed=''},700);var j=items.findIndex(function(o){return o.textContent.trim().toLowerCase().indexOf(typed)===0});if(j>=0)mark(j,true)}});
  s.addEventListener('change',function(){paint(s)});
  s.addEventListener('focus',function(){b.focus()});
  paint(s)}
 function scan(){doc.querySelectorAll('select:not(.ss-n)').forEach(enhance);
  doc.querySelectorAll('.ssb').forEach(function(b){if(!b._ss||!b._ss.isConnected){if(b===cur)close();b.remove()}else paint(b._ss)})}
 /* code that sets select.value / selectedIndex directly also refreshes the menu label */
 ['value','selectedIndex'].forEach(function(p){var d=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,p);if(d&&d.set)Object.defineProperty(HTMLSelectElement.prototype,p,{configurable:true,enumerable:d.enumerable,get:d.get,set:function(v){d.set.call(this,v);if(this._ssb)paint(this)}})});
 doc.addEventListener('mousedown',function(e){if(menu&&!menu.contains(e.target)&&!(cur&&cur.contains(e.target)))close()},true);
 doc.addEventListener('touchstart',function(e){if(menu&&!menu.contains(e.target)&&!(cur&&cur.contains(e.target)))close()},{capture:true,passive:true});
 window.addEventListener('scroll',function(e){if(menu&&!menu.contains(e.target))close()},true);
 window.addEventListener('resize',close);
 var t=0;new MutationObserver(function(){clearTimeout(t);t=setTimeout(scan,30)}).observe(doc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
 scan();
})();

/* ===== KickPredict theme ===== */
:root[data-theme="dark"]{--bg:#030a1a;--panel:#071428;--line:#17386b;--soft:#0b1f40;--acc:#3b9bff;--acc-ink:#021030;--mute:#9db3d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030a1a;--panel:#071428;--line:#17386b;--soft:#0b1f40;--acc:#3b9bff;--acc-ink:#021030;--mute:#9db3d4}}
body{font-family:'Plus Jakarta Sans',Barlow,system-ui,sans-serif}
h1,h2,h3,.big{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.02em}
body.nd-on{background:var(--bg) radial-gradient(ellipse 60% 420px at 20% 0,rgba(59,155,255,.20),transparent 70%),radial-gradient(ellipse 50% 380px at 90% 10%,rgba(59,155,255,.12),transparent 70%) no-repeat}
header{background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav button[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
.card,.tw,.lp-fc,.lp-in,.lp-dev{background:linear-gradient(160deg,rgba(59,155,255,.07),color-mix(in srgb,var(--panel) 86%,transparent) 60%);border:1px solid var(--line);border-radius:18px;box-shadow:0 0 22px rgba(59,155,255,.08),inset 0 0 18px rgba(59,155,255,.04)}
.chip,.lp-b{border-radius:999px}
.chip[aria-pressed=true],.lp-b.p,.tag{background:var(--acc);color:var(--acc-ink);box-shadow:0 0 16px rgba(59,155,255,.45)}
.lp-logo{font-style:normal;color:var(--hd)}.lp-logo i{color:var(--acc)}.lp-logo,.kp-brand{display:inline-flex;align-items:center}
.pb i:first-child{box-shadow:0 0 8px var(--acc)}
.lpx h1{text-align:left}
.lp-nav{gap:18px}
.kp-pill{display:flex;gap:4px;padding:6px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel) 86%,transparent)}
.kp-pill button{font:600 15px 'Plus Jakarta Sans',sans-serif;color:var(--ink);background:none;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.kp-pill button:first-child{color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.kp-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding:34px 0 10px;position:relative}
.kp-hero:before{content:"";position:absolute;inset:-20px -28px 0;z-index:-1;background:repeating-conic-gradient(from 200deg at 50% -10%,rgba(59,155,255,.07) 0 4deg,transparent 4deg 12deg),radial-gradient(ellipse at 50% 120%,rgba(59,155,255,.25),transparent 60%);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.kp-badge{display:inline-block;border:1px solid var(--line);background:rgba(59,155,255,.1);color:var(--acc);border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px}
.kp-hero h1{margin:18px 0 0;font-size:clamp(44px,6.4vw,88px);line-height:.98;color:var(--hd);max-width:none}
.kp-hero h1 em{color:var(--acc);font-style:italic;text-shadow:0 0 28px rgba(59,155,255,.5)}
.kp-hero p{color:var(--ink);font-size:clamp(17px,1.8vw,22px);max-width:560px;margin:18px 0 0}
.kp-hero .lp-cta{justify-content:flex-start}
.kp-top{border:1px solid var(--acc);border-radius:24px;padding:22px;background:linear-gradient(160deg,rgba(59,155,255,.12),color-mix(in srgb,var(--panel) 86%,transparent));box-shadow:0 0 36px rgba(59,155,255,.3)}
.kp-top h3{font-size:19px;margin:0 0 16px;color:var(--hd)}
.kp-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.kp-c{width:74px;height:74px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font:800 26px 'Plus Jakarta Sans';color:var(--acc);border:2px solid var(--acc);background:radial-gradient(circle,rgba(59,155,255,.22),var(--panel));box-shadow:0 0 18px rgba(59,155,255,.4)}
.kp-c.s{width:34px;height:34px;font-size:13px;margin:0;border-width:1px;box-shadow:none}
.kp-vs{font:800 34px 'Plus Jakarta Sans';font-style:italic;color:var(--acc);text-shadow:0 0 16px var(--acc)}
.kp-teams b{font-size:17px;color:var(--hd)}
.kp-when{color:var(--mute);font-size:14px;text-align:center;margin:14px 0}
.kp-pred{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.kp-pred small{color:var(--mute);display:block;font-size:13px}.kp-pred b{font-size:21px;color:var(--hd)}
.kp-pct{background:var(--acc);color:var(--acc-ink);font:800 22px 'Plus Jakarta Sans';border-radius:12px;padding:6px 18px;box-shadow:0 0 18px rgba(59,155,255,.6)}
.kp-strip,.kp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:22px;border:1px solid var(--line);border-radius:22px;background:rgba(7,20,40,.85);box-shadow:0 0 26px rgba(59,155,255,.14)}
.kp-stats{grid-template-columns:repeat(4,1fr);max-width:860px;margin:22px auto 0}
.kp-strip>div,.kp-stats>div{padding:18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kp-strip>div:last-child,.kp-stats>div:last-child{border:0}
.kp-strip b,.kp-stats b{color:var(--hd);font-size:18px}.kp-stats b{font-size:28px;color:var(--acc)}
.kp-strip span,.kp-stats span{color:var(--mute);font-size:13.5px}
.kp-row{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:18px;margin-top:22px}
.kp-p{border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(160deg,rgba(59,155,255,.08),color-mix(in srgb,var(--panel) 86%,transparent));box-shadow:0 0 26px rgba(59,155,255,.12)}
.kp-p h3{font-size:19px;color:var(--hd);margin:0 0 14px}
.kp-m{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.kp-m:first-of-type{border:0}.kp-m .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;flex-wrap:wrap}.kp-m small{display:block;color:var(--mute);font-size:12.5px}
.kp-ai,.kp-lgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp-ai div,.kp-lgs div{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(59,155,255,.06);display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:15px}
.kp-ai small{color:var(--acc);font-weight:600;font-size:12px}
.kp-lgs{grid-template-columns:repeat(2,1fr)}.kp-lgs div{align-items:center;text-align:center;min-height:62px;justify-content:center}
@media(max-width:1000px){.kp-hero,.kp-row{grid-template-columns:1fr}.kp-pill{display:none}.kp-strip{grid-template-columns:1fr 1fr}.kp-strip>div{border-bottom:1px solid var(--line)}}
@media(max-width:560px){.kp-ai{grid-template-columns:1fr 1fr}.kp-stats{grid-template-columns:1fr 1fr}.kp-stats>div{border-bottom:1px solid var(--line)}}

3E%3C/g%3E%3Cg fill='none' stroke='%23fff' stroke-opacity='.7' stroke-width='5'%3E%3Cellipse cx='800' cy='770' rx='230' ry='70'/%3E%3Cpath d='M800 650 L800 890'/%3E%3Crect x='500' y='650' width='600' height='230'/%3E%3C/g%3E%3C/svg%3E") center top/cover no-repeat}
body.nd-on{background:var(--bg)}

/* ===== v3: smaller sizes, light-mode fixes, responsive ===== */

.kp-strip,.kp-stats{background:color-mix(in srgb,var(--panel) 90%,transparent)}
.kp-strip b{color:var(--hd)}.kp-strip span{color:var(--mute)}
.nd-menuw{display:none}
.lpx{padding:0 20px 16px}.lp-nav{padding:16px 0}
.lp-logo{font-size:26px}.lp-b{font-size:14.5px;padding:9px 16px}.lp-b.big{font-size:15.5px;padding:12px 24px}

 const standing=t=>{const r=(L.table||[]).find(x=>x.t===t);if(!r)return'Unavailable';const vals=[r.P,r.pts,r.w,r.d,r.l,r.gf,r.ga];if(vals.some(v=>v!==null&&v!==undefined&&(!Number.isFinite(Number(v))||Number(v)<0)))return'Unavailable';const i=L.table.indexOf(r);return`#${r.rank||i+1} · ${r.pts} pts · ${r.P} played`};
 const meetings=done.filter(f=>(f.home===home&&f.away===away)||(f.home===away&&f.away===home)).slice(0,5);
 const avg=(n,g)=>n?(g/n).toFixed(2):'—';
 const row=(t,x)=>`<tr><td>${adH(t)}</td><td>${x.n}/5</td><td>${x.form||'—'}</td><td>${avg(x.n,x.gf)}</td><td>${avg(x.n,x.ga)}</td><td>${standing(t)}</td></tr>`;
 const age=L.fxAsOf?Math.max(0,Math.floor((Date.now()-L.fxAsOf)/36e5)):null;
 const fresh=age===null?'Match-data update time unavailable':age<1?'Match data updated within the last hour':`Match data last updated ${age} hours ago`;
 const split=(t,label,x)=>`${adH(t)} ${label}: ${x.n}/5 available matches · ${avg(x.n,x.gf)} scored / ${avg(x.n,x.ga)} conceded per match.`;

}

const crApplyAll=()=>document.querySelectorAll('.cr[data-cr]:not([data-ld])').forEach(s=>{const u=crUrl(s.dataset.cr);if(u)crApplyEl(s,u)});
const crMissRecent=n=>typeof CRM[n]==='number'&&Date.now()-CRM[n]<18e5; /* retry missing crests after 30 minutes */
const crPlaceholder=n=>/^[A-Za-z0-9.\-]{1,8} [A-Z]$/.test(n);
async function crRun(){if(CRrun)return;CRrun=1;try{while(CRQ.length){if(Date.now()<CRhold)await crSleep(CRhold-Date.now());const n=CRQ.shift();if(crUrl(n)||crMissRecent(n))continue;
 const lg=typeof domOf==='function'?domOf(n):undefined;
 if(lg&&CRLG[lg]&&!CRLGT[lg]&&!crLgFresh(lg)){CRLGT[lg]=1;try{await crBulk(lg)}catch(e){if(e&&e.rate){CRhold=Date.now()+65e3;CRLGT[lg]=0;CRQ.unshift(n);continue}}if(crUrl(n))continue}
 let u;try{u=await crFetch(n)}catch(e){if(e&&e.rate){CRhold=Date.now()+65e3;CRQ.unshift(n)}else CRB[n]=1;continue}
 CRM[n]=u||Date.now();CRC.s(CRM);if(u)crApply(n,u);await crSleep(120)}}finally{CRrun=0}}
const crWant=n=>{if(!n||crPlaceholder(n)||crUrl(n)||CRB[n]||crMissRecent(n)||CRQ.includes(n))return;CRQ.push(n);crRun()};
const crIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){crIO.unobserve(e.target);crWant(e.target.dataset.cr)}}),{rootMargin:'200px'}):null;
const crScan=()=>document.querySelectorAll('.cr[data-cr]:not([data-ld]):not([data-ob])').forEach(s=>{s.dataset.ob='1';crIO?crIO.observe(s):crWant(s.dataset.cr)});
{let t=0;new MutationObserver(()=>{clearTimeout(t);t=setTimeout(crScan,60)}).observe(document.getElementById('app'),{childList:true,subtree:true})}

const crAllNames=()=>[...new Set([...ALLT,...(CFG.custom||[]).flatMap(c=>c.T||[])])].filter(n=>!crPlaceholder(n));
async function crSync(say){S.crStop=0;const names=crAllNames();let done=0,found=0,tot=names.length;
 const upd=()=>say(`Logos found: ${names.filter(n=>crUrl(n)).length} of ${tot}. Checked ${done}. ${S.crStop?'Stopped.':'Working, you can leave this page open.'}`);
 for(const lg of Object.keys(CRLG)){if(S.crStop)break;if(crLgFresh(lg))continue;try{await crBulk(lg)}catch(e){if(e&&e.rate)await crSleep(65e3)}upd()}
 for(const n of names){if(S.crStop)break;done++;if(crUrl(n)||crMissRecent(n)){continue}try{const u=await crFetch(n);CRM[n]=u||Date.now();if(u){found++;crApply(n,u)}}catch(e){if(e&&e.rate){await crSleep(65e3)}}if(done%5===0){CRC.s(CRM);upd()}}
 CRC.s(CRM);S.crStop=1;say(`Finished. Logos found: ${names.filter(n=>crUrl(n)).length} of ${tot}. The rest use a coloured shield with initials. Use Export crests.json to keep this list.`)}

/* ---- admin: account status helpers ---- */
const adSt=(e,u)=>{if(u&&u.cloud){if(u.status==='banned')return'banned';if(u.status==='locked'&&(!u.lockedUntil||u.lockedUntil>Date.now()))return'locked';return'active'}return LOCK.get(e)?'locked':'active'};

async function adSetStatus(e,st,until,reason){
  const u=USERS[e];

  if(!u||!u.uid)
    return{ok:0,m:'This account cannot be changed.'};

  if(u.role==='admin')
    return{ok:0,m:'Admin accounts cannot be locked or banned.'};

  const t=await cTok();

  if(!t)
    return{ok:0,m:'Your session has expired. Please sign in again.'};

  const action={
    banned:'ban',
    locked:'lock',
    active:u.status==='banned'?'unban':'unlock'
  }[st];

  const body={
    user_id:u.uid,
    action,
    reason:reason||''
  };

  if(action==='lock'&&until){
    body.locked_until=new Date(until).toISOString();
  }

  const r=await cReq('/functions/v1/admin-user-status',{
    method:'POST',
    token:t,
    body
  });

  if(!r.ok){
    return{
      ok:0,
      m:(r.json&&r.json.error)||'Could not update account status. Please try again.'
    };
  }

  if(!r.json||!r.json.ok||!r.json.user){
    return{ok:0,m:'The server returned an unexpected response.'};
  }

  u.status=r.json.user.status;
  u.lockedUntil=r.json.user.locked_until
    ?Date.parse(r.json.user.locked_until):0;
  u.sreason=r.json.user.status_reason||'';

  return{ok:1};
}

 ml.innerHTML=a.map(m=>`<div class='mgb ${m.sender==='admin'?'me':'th'}'>${adH(m.body)}<small>${m.sender==='admin'?'You (the user sees \u201CAdmin\u201D)':adH(u?u.username:'User')} \u00B7 ${new Date(m.created_at).toLocaleString()}</small></div>`).join('')||`<div class='sm'>No messages in this conversation yet.</div>`;

/* ---- admin: polls ---- */
function adPlDraw(){const el=$('#pll');if(!el)return;el.innerHTML=ADM.polls.length?ADM.polls.map(p=>plCard(p,'admin')).join(''):`<div class='sm'>No polls yet.</div>`}
function adPolls(b){
 if(!CLOUD()){b.innerHTML=`<div class='note'>Polls need the Supabase account setup.</div>`;return}
 const fx=[];COUNTRIES.forEach(c=>upFx(c,0).forEach(f=>fx.push(f)));fx.sort((x,y)=>x.ko-y.ko);const FXL=fx.slice(0,60);
 b.innerHTML=`${ADM.pOk===false?NOSETUP:''}<div class='card'><h3 style='margin:0 0 4px'>Create a poll</h3><p class='sm' style='margin:0 0 10px'>Users vote in the Polls tab. They see the percentages only after they vote, and never the number of votes. You see both here.</p>
 <div class='fgrid'><label class='sm'>Type<select id='pk'><option value='debate'>Debate (for example Messi vs Ronaldo)</option><option value='match'>Upcoming match</option></select></label><label class='sm'>Closes (optional)<input type='datetime-local' id='pcl'></label></div>
 <div id='pdeb'><label class='sm' style='display:block;margin-top:8px'>Question<input id='pq' maxlength='140' placeholder='Who is the greatest of all time?'></label><div class='fgrid' style='margin-top:8px'>${[1,2,3,4].map(i=>`<label class='sm'>Option ${i}${i<3?' (required)':' (optional)'}<input id='po${i}' maxlength='60' placeholder='${['Cristiano Ronaldo','Lionel Messi','',''][i-1]}'></label>`).join('')}</div></div>
 <div id='pmat' hidden><label class='sm' style='display:block;margin-top:8px'>Pick an upcoming match (optional)<select id='pfx'><option value=''>Choose a fixture\u2026</option>${FXL.map((f,i)=>`<option value='${i}'>${adH(f.home)} v ${adH(f.away)} \u00B7 ${adH(f.comp)} \u00B7 ${adH(fmt(f.ko))}</option>`).join('')}</select></label><div class='fgrid' style='margin-top:8px'><label class='sm'>Home team<input id='pmh' maxlength='60'></label><label class='sm'>Away team<input id='pma' maxlength='60'></label></div><label class='sm' style='display:flex;gap:8px;align-items:center;margin-top:8px'><input type='checkbox' id='pmd' checked style='width:auto'> Include a Draw option</label></div>
 <label class='sm' style='display:block;margin-top:8px'>Extra note (optional)<input id='pdt' maxlength='160' placeholder='For example: vote before kick-off'></label>
 <button class='chip' id='ppub' style='margin-top:10px;background:var(--acc);color:var(--acc-ink)'>Publish poll</button> <span class='sm' id='ppm'></span></div>
 <h3 style='margin:16px 0 8px'>Your polls</h3><div id='pll'></div>`;
 const sync=()=>{const m=$('#pk').value==='match';$('#pdeb').hidden=m;$('#pmat').hidden=!m};$('#pk').onchange=sync;
 $('#pfx').onchange=()=>{const f=FXL[+$('#pfx').value];if(!f)return;$('#pmh').value=f.home;$('#pma').value=f.away;const d=f.ko,z=n=>String(n).padStart(2,'0');$('#pcl').value=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())};
 $('#ppub').onclick=async()=>{const m=$('#ppm'),kind=$('#pk').value;let q,opts;
  if(kind==='match'){const h=clean($('#pmh').value,60),a=clean($('#pma').value,60);if(!h||!a){m.textContent='Enter both teams.';return}q=h+' vs '+a+' \u2013 who wins?';opts=[h];if($('#pmd').checked)opts.push('Draw');opts.push(a)}
  else{q=clean($('#pq').value,140);opts=[1,2,3,4].map(i=>clean($('#po'+i).value,60)).filter(Boolean);if(q.length<5){m.textContent='Write the question (at least 5 characters).';return}}
  if(new Set(opts.map(x=>x.toLowerCase())).size<2||new Set(opts.map(x=>x.toLowerCase())).size!==opts.length){m.textContent='Add at least two different options.';return}
  const cl=$('#pcl').value,closes=cl?new Date(cl).toISOString():null;if(closes&&Date.parse(closes)<=Date.now()){m.textContent='The closing time must be in the future.';return}
  $('#ppub').disabled=true;m.textContent='Publishing\u2026';
  const r=await sbq('/rest/v1/polls',{method:'POST',body:{kind,question:q,detail:clean($('#pdt').value,160)||null,closes_at:closes},headers:{Prefer:'return=representation'}});
  if(!r.ok||!Array.isArray(r.json)||!r.json[0]){const bt=$('#ppub');if(bt)bt.disabled=false;m.textContent=sbMissing(r)?'The polls tables are missing. Run update.sql in Supabase.':'Could not create the poll. Make sure update.sql was run and you are signed in as admin.';return}
  const id=r.json[0].id,o=await sbq('/rest/v1/poll_options',{method:'POST',body:opts.map((label,i)=>({poll_id:id,label,position:i})),headers:{Prefer:'return=minimal'}});
  const bt=$('#ppub');if(bt)bt.disabled=false;
  if(!o.ok){await sbq('/rest/v1/polls?id=eq.'+id,{method:'DELETE'});m.textContent='Could not save the options, so the poll was not created. Try again.';return}
  logEv('admin_poll',q.slice(0,60),'Admin');m.textContent='Published. Users can vote now.';['pq','po1','po2','po3','po4','pmh','pma','pdt','pcl'].forEach(i=>{const e=$('#'+i);if(e)e.value=''});await adFetchPolls();adPlDraw()};
 $('#pll').onclick=async e=>{const x=e.target.closest('[data-pa]');if(!x)return;const id=x.dataset.id,a=x.dataset.pa;
  if(a==='del'){if(!confirm('Delete this poll and all of its votes? This cannot be undone.'))return;await sbq('/rest/v1/polls?id=eq.'+id,{method:'DELETE'})}
  else await sbq('/rest/v1/polls?id=eq.'+id,{method:'PATCH',body:a==='close'?{status:'closed'}:{status:'open',closes_at:null},headers:{Prefer:'return=minimal'}});
  await adFetchPolls();adPlDraw();ADL.fp=''};
 adPlDraw();adFetchPolls().then(adPlDraw)}

/* ---- admin: automatic refresh (no Ctrl+R needed) ---- */
async function adTick(force){
 if(!S.adm||S.userMode||document.hidden||ADL.busy)return;ADL.busy=1;
 try{let fp='';
  if(CLOUD()){await cAllUsers();await adFetchMsgs();if(S.as==='dash'||S.as==='pl')await adFetchPolls();if(S.as==='dash')await adFetchPred();if(S.as==='dash')await adFetchSite();
   fp=Object.values(USERS).map(u=>[u.uid,u.status,u.lockedUntil,(u.logins||[]).length,(u.preds||[]).length,u.seen,u.username].join(',')).join('|')+'#'+ADM.msgs.length+':'+ADM.unread+':'+(ADM.msgs.length?ADM.msgs[ADM.msgs.length-1].id:'')+'#'+ADM.openPolls+':'+JSON.stringify(PL.res)+'#'+JSON.stringify(ADM.pred)+'#'+JSON.stringify(ADS.d)}
  else{USERS=AU.load();fp=Object.keys(USERS).length+'|'+Object.values(USERS).map(u=>(u.logins||[]).length+':'+(u.preds||[]).length).join(',')+'|'+REQ.g().length+'|'+Object.keys(LOCK.g()).length}
  if(!S.adm)return;
  adBadges();const el=$('#adlive');if(el)el.textContent='\u25CF Live \u00B7 updated '+new Date().toLocaleTimeString();
  if(fp===ADL.fp&&!force)return;ADL.fp=fp;
  const b=$('#adb');if(!b)return;
  if(S.as==='dash')adDash(b);else if(S.as==='us'&&S.udraw)S.udraw();else if(S.as==='ms')adMsgDraw();else if(S.as==='pl')adPlDraw()
 }catch(e){console.warn('admin refresh',e)}finally{ADL.busy=0}}
setInterval(adTick,10000);

addEventListener('hashchange',show);addEventListener('pageshow',e=>{if(e.persisted)show()});(CLOUD()?cloudBoot():Promise.resolve()).catch(e=>console.warn('cloud boot',e)).then(()=>liveBoot()).catch(e=>console.warn('live boot',e)).then(()=>{const dt=document.getElementById('disc-t');if(dt)dt.innerHTML=DISC_LONG;show();trAll();crScan();if(S.flash){const e=$('#er');if(e){e.textContent=TR(S.flash);S.flash=''}}cWatch()});
setInterval(lvPoll,20000);setInterval(()=>{if(LV.dirty&&!document.hidden&&!lvBusy())lvRefresh()},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lvPoll()});
window.addEventListener('focus',()=>lvPoll());
</script>

<script>
/* Styled dropdowns: each <select> keeps working (value, onchange) but is shown as a themed menu. */
(function(){
 var doc=document,cur=null,menu=null,items=[],act=-1,typed='',typedT=0;
 var esc=function(t){var d=doc.createElement('div');d.textContent=t;return d.innerHTML};
 var lab=function(s){var o=s.options[s.selectedIndex];return o?o.textContent.replace(/\s+/g,' ').trim():''};
 function paint(s){var b=s._ssb;if(!b)return;var t=lab(s);b.querySelector('.ssv').textContent=t||'Select';b.disabled=s.disabled;b.classList.toggle('ph',!s.value)}
 function close(){if(menu){menu.remove();menu=null}if(cur){cur.setAttribute('aria-expanded','false');cur=null}items=[];act=-1}
 function mark(i,scroll){if(!menu)return;var n=menu.querySelectorAll('.sso');n.forEach(function(x){x.classList.remove('act')});act=i;if(n[i]){n[i].classList.add('act');if(scroll)n[i].scrollIntoView({block:'nearest'})}}
 function pick(s,i){var o=items[i];if(!o||o.disabled)return;var ch=s.selectedIndex!==o.index;s.selectedIndex=o.index;paint(s);var b=s._ssb;close();if(b)b.focus();if(ch){s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}))}}
 function place(b){var r=b.getBoundingClientRect(),vw=doc.documentElement.clientWidth,vh=window.innerHeight;
  menu.style.minWidth=Math.min(r.width,vw-16)+'px';menu.style.maxWidth=(vw-16)+'px';menu.style.width='auto';
  var left=Math.max(8,Math.min(r.left,vw-menu.offsetWidth-8));
  var below=vh-r.bottom-12,above=r.top-12,h=menu.scrollHeight+12,up=below<Math.min(h,240)&&above>below,avail=Math.max(120,up?above:below);
  menu.style.maxHeight=Math.min(avail,360)+'px';
  menu.style.left=left+'px';
  if(up){menu.style.top='auto';menu.style.bottom=(vh-r.top+6)+'px'}else{menu.style.bottom='auto';menu.style.top=(r.bottom+6)+'px'}}
 function open(s){close();var b=s._ssb;if(!b||b.disabled)return;
  menu=doc.createElement('div');menu.className='ssm';menu.setAttribute('role','listbox');var h='';items=[];
  function add(o){var i=items.length;items.push(o);h+='<div class="sso'+(o.selected?' on':'')+(o.disabled?' off':'')+'" role="option" data-i="'+i+'" aria-selected="'+o.selected+'">'+esc(o.textContent.replace(/\s+/g,' ').trim())+'</div>'}
  Array.prototype.forEach.call(s.children,function(c){if(c.tagName==='OPTGROUP'){h+='<div class="ssg">'+esc(c.label||'')+'</div>';Array.prototype.forEach.call(c.children,add)}else if(c.tagName==='OPTION')add(c)});
  menu.innerHTML=h;doc.body.appendChild(menu);cur=b;b.setAttribute('aria-expanded','true');
  menu.addEventListener('mousedown',function(e){e.preventDefault()});
  menu.addEventListener('click',function(e){var x=e.target.closest('.sso');if(x)pick(s,+x.dataset.i)});
  menu.addEventListener('mousemove',function(e){var x=e.target.closest('.sso');if(x&&+x.dataset.i!==act)mark(+x.dataset.i,false)});
  place(b);var sel=items.findIndex(function(o){return o.selected});mark(sel<0?0:sel,true)}
 function step(d){var n=items.length,i=act;for(var k=0;k<n;k++){i=(i+d+n)%n;if(!items[i].disabled)break}mark(i,true)}
 function enhance(s){
  if(s._ssb||s.multiple||s.size>1||s.hasAttribute('data-native'))return;
  var b=doc.createElement('button');b.type='button';b.className='ssb';b.setAttribute('aria-haspopup','listbox');b.setAttribute('aria-expanded','false');
  b.innerHTML='<span class="ssv"></span><svg class="ssc" viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
  var lb=s.closest('label');if(lb){var t=Array.prototype.filter.call(lb.childNodes,function(n){return n.nodeType===3}).map(function(n){return n.textContent}).join(' ').trim();if(t)b.setAttribute('aria-label',t)}
  s.classList.add('ss-n');s.tabIndex=-1;s.setAttribute('aria-hidden','true');
  s.parentNode.insertBefore(b,s.nextSibling);s._ssb=b;b._ss=s;
  b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(cur===b)close();else open(s)});
  b.addEventListener('keydown',function(e){var k=e.key;
   if(!menu){if(k==='ArrowDown'||k==='ArrowUp'||k==='Enter'||k===' '){e.preventDefault();open(s)}return}
   if(k==='ArrowDown'){e.preventDefault();step(1)}else if(k==='ArrowUp'){e.preventDefault();step(-1)}
   else if(k==='Home'){e.preventDefault();mark(0,true)}else if(k==='End'){e.preventDefault();mark(items.length-1,true)}
   else if(k==='Enter'||k===' '){e.preventDefault();pick(s,act)}
   else if(k==='Escape'){e.preventDefault();e.stopPropagation();close()}
   else if(k==='Tab'){close()}
   else if(k.length===1){typed+=k.toLowerCase();clearTimeout(typedT);typedT=setTimeout(function(){typed=''},700);var j=items.findIndex(function(o){return o.textContent.trim().toLowerCase().indexOf(typed)===0});if(j>=0)mark(j,true)}});
  s.addEventListener('change',function(){paint(s)});
  s.addEventListener('focus',function(){b.focus()});
  paint(s)}
 function scan(){doc.querySelectorAll('select:not(.ss-n)').forEach(enhance);
  doc.querySelectorAll('.ssb').forEach(function(b){if(!b._ss||!b._ss.isConnected){if(b===cur)close();b.remove()}else paint(b._ss)})}
 /* code that sets select.value / selectedIndex directly also refreshes the menu label */
 ['value','selectedIndex'].forEach(function(p){var d=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,p);if(d&&d.set)Object.defineProperty(HTMLSelectElement.prototype,p,{configurable:true,enumerable:d.enumerable,get:d.get,set:function(v){d.set.call(this,v);if(this._ssb)paint(this)}})});
 doc.addEventListener('mousedown',function(e){if(menu&&!menu.contains(e.target)&&!(cur&&cur.contains(e.target)))close()},true);
 doc.addEventListener('touchstart',function(e){if(menu&&!menu.contains(e.target)&&!(cur&&cur.contains(e.target)))close()},{capture:true,passive:true});
 window.addEventListener('scroll',function(e){if(menu&&!menu.contains(e.target))close()},true);
 window.addEventListener('resize',close);
 var t=0;new MutationObserver(function(){clearTimeout(t);t=setTimeout(scan,30)}).observe(doc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
 scan();
})();
</script>
